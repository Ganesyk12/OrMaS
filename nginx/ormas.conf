server {
      listen 80;
      server_name ormas.test;
   
      root /home/ganz/Project/php-laravel-systems/cameleon/public;
      index index.php index.html;
      charset utf-8;
   
      access_log /var/log/nginx/ormas-access.log;
      error_log /var/log/nginx/ormas-error.log;
   
      location / {
         try_files $uri $uri/ /index.php?$query_string;
      }
   
      location ~ \.php$ {
         fastcgi_pass host.containers.internal:9000;
         fastcgi_index index.php;
         include fastcgi_params;
         fastcgi_param SCRIPT_FILENAME /home/ganz/Project/php-laravel-systems/cameleon/public$fastcgi_script_name;
         fastcgi_param DOCUMENT_ROOT /home/ganz/Project/php-laravel-systems/cameleon/public;
      }
   
      location ~ /\.(?!well-known).* {
         deny all;
      }
   
      location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?)$ {
         expires 30d;
         add_header Cache-Control "public, immutable";
      }
}