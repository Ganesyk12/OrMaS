# /home/ganz/Project/php-laravel-systems/cameleon/nginx/laravel.conf
# ---------------------------------------------------------------
# NGINX configuration for the Laravel "cameleon" project
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# 1️⃣ HTTP block (port 80) – redirect all traffic to HTTPS
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;   # Ganti dengan domain Anda, contoh: example.id www.example.id;

    # Redirect semua request ke HTTPS
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------
# 2️⃣ HTTPS block (port 443) – melayani aplikasi Laravel
# ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;   # Ganti dengan domain Anda

    # -----------------------------------------------------------
    # Sertifikat SSL – sesuaikan path dengan tempat Anda menyimpannya
    # -----------------------------------------------------------
    ssl_certificate       /etc/letsencrypt/live/your-domain/fullchain.pem;
    ssl_certificate_key   /etc/letsencrypt/live/your-domain/privkey.pem;

    # -----------------------------------------------------------
    # SSL settings (direkomendasikan oleh Mozilla SSL Config Generator)
    # -----------------------------------------------------------
    ssl_protocols                 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";

    # HSTS (aktifkan bila semua traffic sudah HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # -----------------------------------------------------------
    # ROOT – lokasi folder public Laravel
    # -----------------------------------------------------------
    root /home/ganz/Project/php-laravel-systems/cameleon/public;
    index index.php index.html index.htm;

    # -----------------------------------------------------------
    # Log files (opsional, sesuaikan path bila diperlukan)
    # -----------------------------------------------------------
    access_log  /var/log/nginx/cameleon-access.log  main;
    error_log   /var/log/nginx/cameleon-error.log   warn;

    # -----------------------------------------------------------
    # Gzip compression (opsional, mempercepat transfer)
    # -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/html
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # -----------------------------------------------------------
    # PHP‑FPM configuration – sesuaikan socket atau port PHP Anda
    # -----------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # ubah versi PHP bila diperlukan
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
    }

    # -----------------------------------------------------------
    # Static files – cache maksimal 1 tahun
    # -----------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------
    # Laravel front‑controller (fallback ke index.php)
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------
    # Block access to hidden files (.*) and .env
    # -----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------
    # Optional – block direct access to storage/framework/views
    # -----------------------------------------------------------
    location ^~ /storage/ {
        deny all;
        return 404;
    }
}
